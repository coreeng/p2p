on:
  workflow_call:
    secrets:
      env_vars:
        required: false
      container_registry_user:
        required: false
      container_registry_pat:
        required: false
      container_registry_url:
        required: false
    inputs:
      command:
        required: true
        type: string
      runner-label:
        description: 'GitHub Actions runner label for command execution.'
        required: false
        type: string
        default: ''
      github_env:
        required: false
        type: string
        default: ''
      dry-run:
        required: false
        type: boolean
        default: false
      region:
        required: false
        type: string
        default: ''
      subnamespace:
        required: false
        type: string
        default: ''
      app-name:
        required: false
        type: string
        default: ''
      tenant-name:
        required: false
        type: string
        default: ''
      version:
        required: true
        type: string
      checkout-version:
        required: false
        type: string
      zone:
        required: false
        type: string
        default: europe-west2-a
      pre-targets:
        description: |
          Make targets to run before the command
        required: false
        type: string
        default: ''
      post-targets:
        description: |
          Make targets to run after the command
        required: false
        type: string
        default: ''
      working-directory:
        required: false
        type: string
        default: '.'
      skip-subnamespaces-create:
        description: |
          Skip creating subnamespaces
        required: false
        type: boolean
        default: false
      artifacts:
        required: false
        type: string
        default: ''

jobs:
  exec:
    name: '${{ inputs.command }} (${{ inputs.github_env }})'
    runs-on: ${{ inputs.runner-label || vars.P2P_RUNNER_LABEL || 'ubuntu-24.04' }}
    environment: ${{ inputs.github_env }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: >-
        ${{ inputs.command == 'p2p-build'
        && format('{0}/{1}-{2}-build-{3}-{4}', inputs.github_env, inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME, inputs.app-name, github.run_id, github.run_attempt)
        || format('{0}/{1}-{2}-{3}', inputs.github_env, inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME, inputs.app-name, inputs.subnamespace) }}
      cancel-in-progress: false
    env:
      env_vars: ${{ secrets.env_vars }}
      BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
      INTERNAL_SERVICES_DOMAIN: ${{ vars.INTERNAL_SERVICES_DOMAIN }}
      DPLATFORM: ${{ vars.DPLATFORM || inputs.github_env }}
      PLATFORM_ENVIRONMENT: ${{ vars.DPLATFORM || inputs.github_env }}
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      REGION: ${{ inputs.region || vars.REGION || 'europe-west2' }}
      REGISTRY: ${{ inputs.region || vars.REGION || 'europe-west2' }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/tenant/${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}
      VERSION: ${{ inputs.version }}
      SERVICE_ACCOUNT: p2p-${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}@${{ vars.PROJECT_ID }}.iam.gserviceaccount.com
      TENANT_NAME: ${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}
      WORKLOAD_IDENTITY_PROVIDER: projects/${{ vars.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/p2p-${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}/providers/p2p-${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}
      CORECTL_PORTAL_URL: ${{ vars.CORECTL_PORTAL_URL }}
      CORECTL_CONTEXT: ${{ vars.CORECTL_CONTEXT }}
    steps:
      - name: print env context
        run: |
          yq 'del(.env_vars)' -p=json -C <<EOT
          ${{ toJSON(env) }}
          EOT

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.dry-run == false && inputs.checkout-version || '' }}

      - name: Setup corectl
        if: ${{ inputs.dry-run == false && vars.CORECTL_CONTEXT != '' }}
        uses: $/.github/actions/setup-corectl
        with:
          version: ${{ vars.CORECTL_VERSION || 'latest' }}

      - name: Connect to cluster
        id: corectl-connect
        if: ${{ inputs.dry-run == false && vars.CORECTL_CONTEXT != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CORECTL_CONTEXT" || -z "$DPLATFORM" ]]; then
            echo "corectl OIDC requires a context and DPLATFORM cluster" >&2
            exit 1
          fi
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/corectl-ci" >> "$GITHUB_ENV"
          echo "KUBECONFIG=$RUNNER_TEMP/corectl-kubeconfig" >> "$GITHUB_ENV"
          portal_args=()
          if [[ -n "$CORECTL_PORTAL_URL" ]]; then
            portal_args=(--url "$CORECTL_PORTAL_URL")
          fi
          XDG_CONFIG_HOME="$RUNNER_TEMP/corectl-ci" \
            corectl connect "$DPLATFORM" --oidc github \
            --context "$CORECTL_CONTEXT" "${portal_args[@]}" \
            --kubeconfig "$RUNNER_TEMP/corectl-kubeconfig"

      # Provider-specific authentication belongs to the legacy path. The corectl
      # path uses Portal OIDC and Pinniped without GKE, AWS, or Azure credentials.
      - name: Authenticate to Google Cloud for GKE and Artifact Registry
        id: auth
        if: ${{ inputs.dry-run == false && vars.CORECTL_CONTEXT == '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Setup Google Cloud SDK
        id: setup-gcloud
        if: ${{ inputs.dry-run == false && vars.CORECTL_CONTEXT == '' }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true

      - name: Setup kubeconfig
        id: setup-kubeconfig
        if: ${{ inputs.dry-run == false && vars.CORECTL_CONTEXT == '' }}
        uses: google-github-actions/get-gke-credentials@v3
        with:
          context_name: gke_${{ env.PROJECT_ID }}_${{ env.REGION }}_${{ env.DPLATFORM }}
          cluster_name: ${{ env.DPLATFORM }}
          location: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          use_dns_based_endpoint: true

      - name: Test kubeconfig
        id: test-kubeconfig
        if: ${{ inputs.dry-run == false }}
        env:
          VERIFY_SUBNAMESPACE_CREATION: ${{ inputs.skip-subnamespaces-create == false && inputs.app-name != '' && inputs.subnamespace != '' }}
        run: |
          kubectl cluster-info --namespace "$TENANT_NAME"
          kubectl auth whoami
          if [[ "$VERIFY_SUBNAMESPACE_CREATION" == true ]]; then
            kubectl auth can-i create subnamespaceanchors.hnc.x-k8s.io -n "$TENANT_NAME" | grep -qx yes
          fi

      - name: Prepare image registry client
        if: ${{ inputs.dry-run == false && vars.CORECTL_CONTEXT != '' }}
        shell: bash
        run: |
          set -euo pipefail
          docker_config="$RUNNER_TEMP/p2p-registry-docker"
          install -d -m 0700 "$docker_config"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"

      - name: Setup Docker Buildx
        id: setup-docker-buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            default-load=true

      - name: Setup skopeo
        id: setup-skopeo
        shell: bash
        run: |
          curl -fsSL "https://github.com/lework/skopeo-binary/releases/download/v1.24.0/skopeo-linux-amd64" -o /usr/local/bin/skopeo
          chmod +x /usr/local/bin/skopeo
          skopeo --version

      - name: Expose GitHub Runtime
        id: expose-github-runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        if: ${{ inputs.dry-run == false && vars.CORECTL_CONTEXT == '' }}
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Login to tenant provided registry
        env:
          REGISTRY_USER: ${{ secrets.container_registry_user }}
          REGISTRY_PAT: ${{ secrets.container_registry_pat }}
          REGISTRY_URL: ${{ secrets.container_registry_url }}
        if: ${{ vars.CORECTL_CONTEXT == '' && env.REGISTRY_USER && env.REGISTRY_PAT }}
        run: |
          echo ${{ env.REGISTRY_PAT }} | docker login ${{ env.REGISTRY_URL }} -u ${{ env.REGISTRY_USER }} --password-stdin

      - name: ${{ inputs.subnamespace == '' && 'Setup subnamespace' || format('Setup subnamespace {0}', inputs.app-name != env.TENANT_NAME && format('{0}-{1}-{2}', env.TENANT_NAME, inputs.app-name, inputs.subnamespace) || format('{0}-{1}', env.TENANT_NAME, inputs.subnamespace)) }}
        id: setup-subnamespace
        if: ${{ inputs.dry-run == false && inputs.skip-subnamespaces-create == false && inputs.app-name != '' && inputs.subnamespace != '' }}
        run: |
          if [[ "${{ env.TENANT_NAME }}" == "${{ inputs.app-name }}" ]]; then
            SUBNAMESPACE="${{ env.TENANT_NAME }}-${{ inputs.subnamespace }}"
          else
            SUBNAMESPACE="${{ env.TENANT_NAME }}-${{ inputs.app-name }}-${{ inputs.subnamespace }}"
          fi
          set -euo pipefail
          cat <<EOF | kubectl apply -n "${{ env.TENANT_NAME }}" -f -
          apiVersion: hnc.x-k8s.io/v1alpha2
          kind: SubnamespaceAnchor
          metadata:
            name: ${SUBNAMESPACE}
          EOF
          until [ "$(kubectl -n "${{ env.TENANT_NAME }}" get subnamespaceanchor "${SUBNAMESPACE}" -o jsonpath='{.status.status}' 2>/dev/null)" = "Ok" ]; do
            echo "Waiting for subnamespace ${SUBNAMESPACE} to be ready..."
            sleep 2
          done
          kubectl config set-context --current --namespace="${SUBNAMESPACE}"
          echo ""
          if [[ -n "$CORECTL_CONTEXT" ]]; then
            for attempt in {1..60}; do
              if kubectl auth can-i create deployments.apps -n "${SUBNAMESPACE}" | grep -qx yes; then
                break
              fi
              if (( attempt == 60 )); then
                echo "Timed out waiting for deployment access to subnamespace ${SUBNAMESPACE}" >&2
                exit 1
              fi
              sleep 2
            done
          else
            kubectl get ns "${SUBNAMESPACE}"
          fi

      - name: Decode environment variables
        shell: bash
        run: |
          IFS=$'\n'
          for i in $env_vars; do
            if [[ "$i" =~ ^CORECTL_CONTEXT= ]]; then
              echo "Application environment variables cannot override CORECTL_CONTEXT" >&2
              exit 1
            fi
            if [[ -n "$CORECTL_CONTEXT" && "$i" =~ ^(P2P_REGISTRY|REGISTRY=|TENANT_NAME=|GITHUB_REPOSITORY_ID=|DPLATFORM=|CORECTL_PORTAL_URL=|DOCKER_CONFIG=|RUNNER_TEMP=) ]]; then
              echo "Application environment variables cannot override platform registry configuration" >&2
              exit 1
            fi
            i="${i%%=*}"="${i#*=}"
            echo "::add-mask::${i#*=}"
            printf '%s\n' "${i//\\/\\\\}" >> "${GITHUB_ENV}"
          done

      - name: Connect to image registry
        if: ${{ inputs.dry-run == false && vars.CORECTL_CONTEXT != '' }}
        shell: bash
        env:
          EXPECTED_GITHUB_ENV: ${{ inputs.github_env }}
        run: |
          set -euo pipefail
          corectl p2p registry connect "$DPLATFORM" --application "$TENANT_NAME" \
            --context "$CORECTL_CONTEXT" --url "$CORECTL_PORTAL_URL" \
            --ci-environment "$EXPECTED_GITHUB_ENV" --output env >> "$GITHUB_ENV"

      - name: Authenticate to image registry
        if: ${{ inputs.dry-run == false && vars.CORECTL_CONTEXT != '' }}
        shell: bash
        run: |
          corectl p2p registry login "$DPLATFORM" --context "$CORECTL_CONTEXT"

      - name: Set p2p variables
        id: setup-p2p-variables
        run: |
          env | grep "^P2P_" | sort
          export P2P_TENANT_NAME="${{ env.TENANT_NAME }}"
          export P2P_APP_NAME=${{ inputs.app-name }}
          export P2P_VERSION=${{ inputs.version }}
          if [[ -n "$CORECTL_CONTEXT" ]]; then
            : "${P2P_REGISTRY:?platform registry contract is missing}"
            if [[ "${{ inputs.command }}" != "p2p-build" ]]; then
              echo "Cluster image pulls are not available yet" >&2
              exit 1
            fi
          else
            export P2P_REGISTRY=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/tenant/${{ env.TENANT_NAME }}
          fi
          export P2P_REGISTRY_FAST_FEEDBACK_PATH=fast-feedback
          export P2P_REGISTRY_EXTENDED_TEST_PATH=extended-test
          export P2P_REGISTRY_PROD_PATH=prod
          export P2P_REGISTRY_FAST_FEEDBACK=${P2P_REGISTRY}/${P2P_REGISTRY_FAST_FEEDBACK_PATH}
          export P2P_REGISTRY_EXTENDED_TEST=${P2P_REGISTRY}/${P2P_REGISTRY_EXTENDED_TEST_PATH}
          export P2P_REGISTRY_PROD=${P2P_REGISTRY}/${P2P_REGISTRY_PROD_PATH}
          if [[ "${{ env.TENANT_NAME }}" == "${{ inputs.app-name }}" ]]; then
            P2P_NAMESPACE="${{ env.TENANT_NAME }}"
          else
            P2P_NAMESPACE="${{ env.TENANT_NAME }}-${{ inputs.app-name }}"
          fi
          export P2P_NAMESPACE_FUNCTIONAL=${P2P_NAMESPACE}-functional
          export P2P_NAMESPACE_NFT=${P2P_NAMESPACE}-nft
          export P2P_NAMESPACE_INTEGRATION=${P2P_NAMESPACE}-integration
          export P2P_NAMESPACE_EXTENDED=${P2P_NAMESPACE}-extended
          export P2P_NAMESPACE_PROD=${P2P_NAMESPACE}-prod
          env | grep "^P2P_" | sort | tee "${GITHUB_ENV}"

      - name: Run make ${{ inputs.command }}
        id: run-command
        if: ${{ inputs.dry-run == false }}
        working-directory: ${{ inputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          make ${{ inputs.command }}

      - name: Resolve artifact paths
        id: resolve-artifacts
        if: ${{ always() && inputs.artifacts != '' }}
        run: |
          # Write the artifacts YAML config from the input string.
          cat <<'EOF' > artifacts.yaml
          ${{ inputs.artifacts }}
          EOF

          # Extract raw paths for the current command from the YAML config.
          raw_paths=$(yq -r '."${{ inputs.command }}" // [] | .[]' artifacts.yaml || true)

          # Make artifact paths relative to the configured working-directory (if not ".").
          wd="${{ inputs.working-directory }}"
          prefixed_paths=""
          while IFS= read -r p; do
            [ -z "${p}" ] && continue
            if [ -n "${wd}" ] && [ "${wd}" != "." ]; then
              case "${p}" in
                /*) prefixed="${p}" ;;
                *)  prefixed="${wd}/${p}" ;;
              esac
            else
              prefixed="${p}"
            fi

            if [ -z "${prefixed_paths}" ]; then
              prefixed_paths="${prefixed}"
            else
              prefixed_paths="${prefixed_paths}"$'\n'"${prefixed}"
            fi
          done <<< "${raw_paths}"

          if [ -n "${prefixed_paths}" ]; then
            {
              echo "paths<<EOF"
              echo "${prefixed_paths}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload artifacts
        if: ${{ always() && steps.resolve-artifacts.outputs.paths != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.command }}-${{ inputs.github_env || 'noenv' }}-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: ${{ steps.resolve-artifacts.outputs.paths }}
          retention-days: 14
          if-no-files-found: warn

      - name: Disconnect from image registry
        if: ${{ always() && inputs.dry-run == false && vars.CORECTL_CONTEXT != '' }}
        shell: bash
        run: |
          if command -v corectl >/dev/null && ! corectl p2p registry disconnect "$DPLATFORM" --context "$CORECTL_CONTEXT"; then
            echo "::warning title=Registry cleanup failed::The image registry connection may still be active"
          fi

      - name: Disconnect from cluster
        if: ${{ always() && steps.corectl-connect.outcome == 'success' }}
        shell: bash
        run: |
          if ! corectl disconnect --kubeconfig "$KUBECONFIG"; then
            echo "::warning title=Tunnel cleanup failed::corectl disconnect failed; check for a remaining tunnel and Portal session"
          fi
