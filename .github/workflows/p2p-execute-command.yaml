on:
  workflow_call:
    secrets:
      env_vars:
        required: false
      container_registry_user:
        required: false
      container_registry_pat:
        required: false
      container_registry_url:
        required: false
    inputs:
      command:
        required: true
        type: string
      github_env:
        required: false
        type: string
        default: ''
      dry-run:
        required: false
        type: boolean
        default: false
      region:
        required: false
        type: string
        default: europe-west2
      subnamespace:
        required: false
        type: string
        default: ''
      app-name:
        required: false
        type: string
        default: ''
      tenant-name:
        required: false
        type: string
        default: ''
      version:
        required: true
        type: string
      checkout-version:
        required: false
        type: string
      zone:
        required: false
        type: string
        default: europe-west2-a
      pre-targets:
        description: |
          Make targets to run before the command
        required: false
        type: string
        default: ''
      post-targets:
        description: |
          Make targets to run after the command
        required: false
        type: string
        default: ''
      working-directory:
        required: false
        type: string
        default: '.'
      skip-subnamespaces-create:
        description: |
          Skip creating subnamespaces
        required: false
        type: boolean
        default: false
      artifacts:
        required: false
        type: string
        default: ''

jobs:
  exec:
    name: '${{ inputs.command }} (${{ inputs.github_env }})'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    environment: ${{ inputs.github_env }}
    concurrency:
      group: ${{ inputs.github_env }}/${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}-${{ inputs.app-name }}-${{ inputs.subnamespace }}
      cancel-in-progress: false
    env:
      env_vars: ${{ secrets.env_vars }}
      BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
      INTERNAL_SERVICES_DOMAIN: ${{ vars.INTERNAL_SERVICES_DOMAIN }}
      DPLATFORM: ${{ vars.DPLATFORM }}
      PLATFORM_ENVIRONMENT: ${{ vars.DPLATFORM }}
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      REGION: ${{ vars.REGION || inputs.region }}
      REGISTRY_MODE: ${{ vars.REGISTRY_MODE || 'artifact-registry' }}
      P2P_REGISTRY_CONFIGURED: ${{ vars.P2P_REGISTRY }}
      P2P_DEPLOYMENT_REGISTRY_CONFIGURED: ${{ vars.P2P_DEPLOYMENT_REGISTRY }}
      ZOT_OIDC_AUDIENCE: ${{ vars.ZOT_OIDC_AUDIENCE }}
      REGISTRY: ${{ vars.REGION || inputs.region }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/tenant/${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}
      VERSION: ${{ inputs.version }}
      SERVICE_ACCOUNT: p2p-${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}@${{ vars.PROJECT_ID }}.iam.gserviceaccount.com
      TENANT_NAME: ${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}
      WORKLOAD_IDENTITY_PROVIDER: projects/${{ vars.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/p2p-${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}/providers/p2p-${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}
    steps:
      - name: print env context
        run: |
          yq 'del(.env_vars)' -p=json -C <<EOT
          ${{ toJSON(env) }}
          EOT

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.dry-run == false && inputs.checkout-version || '' }}

      - name: Checkout P2P workflow sources
        if: ${{ inputs.dry-run == false }}
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .p2p-workflow-src

      - name: Move P2P workflow sources outside app workspace
        if: ${{ inputs.dry-run == false }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/p2p-workflow-src"
          mv .p2p-workflow-src "$RUNNER_TEMP/p2p-workflow-src"

      - name: Validate Zot registry configuration
        if: ${{ inputs.dry-run == false && env.REGISTRY_MODE == 'zot' }}
        shell: bash
        run: |
          set -euo pipefail
          : "${P2P_REGISTRY_CONFIGURED:?P2P_REGISTRY is required in Zot mode}"
          : "${P2P_DEPLOYMENT_REGISTRY_CONFIGURED:?P2P_DEPLOYMENT_REGISTRY is required in Zot mode}"
          : "${ZOT_OIDC_AUDIENCE:?ZOT_OIDC_AUDIENCE is required in Zot mode}"
          validate_registry_host() {
            local value="$1" host="$1" port='' normalized_port label
            local labels=()
            if [[ "$value" == *:* ]]; then
              [[ "$value" != *:*:* ]] || return 1
              host="${value%:*}"
              port="${value##*:}"
              [[ "$port" =~ ^[0-9]+$ ]] || return 1
              normalized_port="$port"
              while [[ ${#normalized_port} -gt 1 && "$normalized_port" == 0* ]]; do
                normalized_port="${normalized_port#0}"
              done
              [[ ${#normalized_port} -le 5 ]] || return 1
              ((10#$normalized_port >= 1 && 10#$normalized_port <= 65535)) || return 1
            fi
            [[ -n "$host" && ${#host} -le 253 ]] || return 1
            [[ "$host" =~ ^[A-Za-z0-9.-]+$ ]] || return 1
            [[ "$host" != .* && "$host" != *. && "$host" != *..* ]] || return 1
            IFS='.' read -r -a labels <<< "$host"
            for label in "${labels[@]}"; do
              [[ ${#label} -le 63 ]] || return 1
              [[ "$label" =~ ^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?$ ]] || return 1
            done
          }
          for registry in "$P2P_REGISTRY_CONFIGURED" "$P2P_DEPLOYMENT_REGISTRY_CONFIGURED"; do
            if ! validate_registry_host "$registry"; then
              echo "Registry must be a bare registry host with an optional port" >&2
              exit 1
            fi
          done
          if [[ ! "$ZOT_OIDC_AUDIENCE" =~ ^[^[:space:]/]+$ ]]; then
            echo "ZOT_OIDC_AUDIENCE must be a non-empty audience without whitespace or slashes" >&2
            exit 1
          fi

      - name: Validate Pinniped configuration
        if: ${{ inputs.dry-run == false }}
        shell: bash
        env:
          DPLATFORM: ${{ vars.DPLATFORM }}
          TENANT_NAME: ${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}
          GITHUB_ENVIRONMENT: ${{ inputs.github_env }}
          PINNIPED_ENDPOINT: ${{ vars.PINNIPED_ENDPOINT }}
          PINNIPED_CA_BUNDLE: ${{ vars.PINNIPED_CA_BUNDLE }}
        run: |
          set -euo pipefail
          : "${DPLATFORM:?DPLATFORM is required}"
          : "${TENANT_NAME:?TENANT_NAME is required}"
          : "${PINNIPED_ENDPOINT:?PINNIPED_ENDPOINT is required}"
          : "${PINNIPED_CA_BUNDLE:?PINNIPED_CA_BUNDLE is required}"
          if ! [[ "$GITHUB_ENVIRONMENT" == "$DPLATFORM" ]]; then
            echo "github_env must exactly match DPLATFORM" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        id: auth
        if: ${{ inputs.dry-run == false && env.REGISTRY_MODE != 'zot' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Setup Google Cloud SDK
        id: setup-gcloud
        if: ${{ inputs.dry-run == false }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          skip_install: true

      - name: Install Pinniped CLI
        if: ${{ inputs.dry-run == false }}
        shell: bash
        run: |
          set -euo pipefail
          pinniped_binary="$RUNNER_TEMP/pinniped-cli-linux-amd64"
          curl --disable --fail --silent --show-error --location \
            "https://get.pinniped.dev/v0.47.0/pinniped-cli-linux-amd64" \
            --output "$pinniped_binary"
          printf '%s  %s\n' \
            '43538ad0c9c9ad67fb121f3d1e8d174324b9fea63f07ec88936182889df752a6' \
            "$pinniped_binary" | sha256sum --check
          sudo install -m 0755 "$pinniped_binary" /usr/local/bin/pinniped

      - name: Configure Pinniped kubeconfig
        if: ${{ inputs.dry-run == false }}
        shell: bash
        env:
          PINNIPED_ENDPOINT: ${{ vars.PINNIPED_ENDPOINT }}
          PINNIPED_CA_BUNDLE: ${{ vars.PINNIPED_CA_BUNDLE }}
        run: |
          set -euo pipefail
          ca_file="$(mktemp "$RUNNER_TEMP/pinniped-ca.XXXXXX")"
          kubeconfig="$RUNNER_TEMP/pinniped-kubeconfig"
          audience="core-platform:${DPLATFORM}:${TENANT_NAME}"
          authenticator="github-actions-${TENANT_NAME}"
          printf '%s' "$PINNIPED_CA_BUNDLE" | base64 --decode > "$ca_file"
          chmod 0600 "$ca_file"
          rm -f "$kubeconfig"
          kubectl config set-cluster "$DPLATFORM" \
            --server="$PINNIPED_ENDPOINT" \
            --certificate-authority="$ca_file" \
            --embed-certs=true \
            --kubeconfig="$kubeconfig"
          kubectl config set-credentials pinniped \
            --exec-command="$RUNNER_TEMP/p2p-workflow-src/.github/scripts/github-oidc-credential" \
            --exec-api-version=client.authentication.k8s.io/v1beta1 \
            --exec-interactive-mode=Never \
            --exec-arg="--audience=${audience}" \
            --exec-arg=--enable-concierge \
            --exec-arg=--concierge-api-group-suffix=pinniped.dev \
            --exec-arg="--concierge-authenticator-name=${authenticator}" \
            --exec-arg=--concierge-authenticator-type=jwt \
            --exec-arg="--concierge-endpoint=${PINNIPED_ENDPOINT}" \
            --exec-arg="--concierge-ca-bundle-data=${PINNIPED_CA_BUNDLE}" \
            --exec-arg=--credential-cache= \
            --kubeconfig="$kubeconfig"
          kubectl config set-context "$DPLATFORM" \
            --cluster="$DPLATFORM" \
            --user=pinniped \
            --namespace="$TENANT_NAME" \
            --kubeconfig="$kubeconfig"
          kubectl config use-context "$DPLATFORM" --kubeconfig="$kubeconfig"
          echo "KUBECONFIG=${kubeconfig}" >> "$GITHUB_ENV"

      - name: Preflight Pinniped authentication
        if: ${{ inputs.dry-run == false }}
        shell: bash
        run: |
          set -euo pipefail
          pinniped whoami --kubeconfig "$KUBECONFIG" >/dev/null
          echo "Pinniped authentication succeeded"

      - name: Prepare Zot registry credentials
        if: ${{ inputs.dry-run == false && env.REGISTRY_MODE == 'zot' }}
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/p2p-execute-docker-config
        run: |
          set -euo pipefail
          install -d -m 0700 "$DOCKER_CONFIG"
          printf 'DOCKER_CONFIG=%s\n' "$DOCKER_CONFIG" >> "$GITHUB_ENV"
          printf 'P2P_ZOT_AUTH_FILE=%s\n' "$RUNNER_TEMP/p2p-execute-zot-auth.json" >> "$GITHUB_ENV"

      - name: Install Skopeo from Ubuntu packages
        id: setup-skopeo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes skopeo
          skopeo --version

      - name: Login to Zot registry
        if: ${{ inputs.dry-run == false && env.REGISTRY_MODE == 'zot' }}
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/p2p-execute-docker-config
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/p2p-workflow-src/.github/scripts/github-oidc-registry-login" \
            --audience "$ZOT_OIDC_AUDIENCE" \
            --registry "$P2P_REGISTRY_CONFIGURED" \
            --skopeo-auth-file "$RUNNER_TEMP/p2p-execute-zot-auth.json"

      - name: Setup Docker Buildx
        id: setup-docker-buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            default-load=true
          cleanup: false

      - name: Expose GitHub Runtime
        id: expose-github-runtime
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        if: ${{ inputs.dry-run == false && env.REGISTRY_MODE != 'zot' }}
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Login to tenant provided registry
        env:
          REGISTRY_USER: ${{ secrets.container_registry_user }}
          REGISTRY_PAT: ${{ secrets.container_registry_pat }}
          REGISTRY_URL: ${{ secrets.container_registry_url }}
        if:  ${{ env.REGISTRY_USER && env.REGISTRY_PAT }}
        run: |
          echo ${{ env.REGISTRY_PAT }} | docker login ${{ env.REGISTRY_URL }} -u ${{ env.REGISTRY_USER }} --password-stdin

      - name: Resolve target namespace
        id: resolve-target-namespace
        if: ${{ inputs.dry-run == false && inputs.app-name != '' && inputs.subnamespace != '' }}
        shell: bash
        env:
          APP_NAME: ${{ inputs.app-name }}
          SUBNAMESPACE: ${{ inputs.subnamespace }}
        run: |
          set -euo pipefail
          if [[ "$TENANT_NAME" == "$APP_NAME" ]]; then
            target_namespace="${TENANT_NAME}-${SUBNAMESPACE}"
          else
            target_namespace="${TENANT_NAME}-${APP_NAME}-${SUBNAMESPACE}"
          fi
          echo "target-namespace=${target_namespace}" >> "$GITHUB_OUTPUT"

      - name: Authorize subnamespace creation
        if: ${{ inputs.dry-run == false && inputs.skip-subnamespaces-create == false && inputs.app-name != '' && inputs.subnamespace != '' }}
        shell: bash
        env:
          TARGET_NAMESPACE: ${{ steps.resolve-target-namespace.outputs.target-namespace }}
        run: |
          set -euo pipefail
          anchor="$(kubectl get subnamespaceanchor "$TARGET_NAMESPACE" --namespace "$TENANT_NAME" --ignore-not-found -o name)"
          if [[ -n "$anchor" ]]; then
            operation="patch"
          else
            operation="create"
          fi
          if ! kubectl auth can-i "$operation" subnamespaceanchors.hnc.x-k8s.io --namespace "$TENANT_NAME" --quiet; then
            echo "Pinniped identity cannot ${operation} tenant subnamespace anchors" >&2
            exit 1
          fi

      - name: Setup subnamespace ${{ steps.resolve-target-namespace.outputs.target-namespace }}
        id: setup-subnamespace
        if: ${{ inputs.dry-run == false && inputs.skip-subnamespaces-create == false && inputs.app-name != '' && inputs.subnamespace != '' }}
        env:
          TARGET_NAMESPACE: ${{ steps.resolve-target-namespace.outputs.target-namespace }}
        run: |
          set -euo pipefail
          cat <<EOF | kubectl apply -n "${{ env.TENANT_NAME }}" -f -
          apiVersion: hnc.x-k8s.io/v1alpha2
          kind: SubnamespaceAnchor
          metadata:
            name: ${TARGET_NAMESPACE}
          EOF
          until [ "$(kubectl -n "${{ env.TENANT_NAME }}" get subnamespaceanchor "${TARGET_NAMESPACE}" -o jsonpath='{.status.status}' 2>/dev/null)" = "Ok" ]; do
            echo "Waiting for subnamespace ${TARGET_NAMESPACE} to be ready..."
            sleep 2
          done
          kubectl config set-context --current --namespace="${TARGET_NAMESPACE}"
          echo ""
          kubectl get ns "${TARGET_NAMESPACE}"

      - name: Authorize target namespace deployment
        if: ${{ inputs.dry-run == false && inputs.app-name != '' && inputs.subnamespace != '' }}
        shell: bash
        env:
          TARGET_NAMESPACE: ${{ steps.resolve-target-namespace.outputs.target-namespace }}
        run: |
          set -euo pipefail
          if ! kubectl auth can-i create deployments.apps --namespace "$TARGET_NAMESPACE" --quiet; then
            echo "Pinniped identity cannot create deployments in the target namespace" >&2
            exit 1
          fi

      - name: Decode environment variables
        shell: bash
        run: |
          IFS=$'\n'
          for i in $env_vars; do
            i="${i%%=*}"="${i#*=}"
            echo "::add-mask::${i#*=}"
            printf '%s\n' "${i//\\/\\\\}" >> "${GITHUB_ENV}"
          done

      - name: Set p2p variables
        id: setup-p2p-variables
        run: |
          env | grep "^P2P_" | sort
          export P2P_TENANT_NAME="${{ env.TENANT_NAME }}"
          export P2P_APP_NAME=${{ inputs.app-name }}
          export P2P_VERSION=${{ inputs.version }}
          if [[ "$REGISTRY_MODE" == "zot" ]]; then
            P2P_REGISTRY="${P2P_REGISTRY_CONFIGURED}"
            P2P_DEPLOYMENT_REGISTRY="${P2P_DEPLOYMENT_REGISTRY_CONFIGURED}"
          else
            P2P_REGISTRY=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/tenant/${{ env.TENANT_NAME }}
            P2P_DEPLOYMENT_REGISTRY="$P2P_REGISTRY"
          fi
          export P2P_REGISTRY P2P_DEPLOYMENT_REGISTRY
          export P2P_REGISTRY_FAST_FEEDBACK_PATH=fast-feedback
          export P2P_REGISTRY_EXTENDED_TEST_PATH=extended-test
          export P2P_REGISTRY_PROD_PATH=prod
          export P2P_REGISTRY_FAST_FEEDBACK=${P2P_REGISTRY}/${P2P_REGISTRY_FAST_FEEDBACK_PATH}
          export P2P_REGISTRY_EXTENDED_TEST=${P2P_REGISTRY}/${P2P_REGISTRY_EXTENDED_TEST_PATH}
          export P2P_REGISTRY_PROD=${P2P_REGISTRY}/${P2P_REGISTRY_PROD_PATH}
          export P2P_DEPLOYMENT_REGISTRY_FAST_FEEDBACK=${P2P_DEPLOYMENT_REGISTRY}/${P2P_REGISTRY_FAST_FEEDBACK_PATH}
          export P2P_DEPLOYMENT_REGISTRY_EXTENDED_TEST=${P2P_DEPLOYMENT_REGISTRY}/${P2P_REGISTRY_EXTENDED_TEST_PATH}
          export P2P_DEPLOYMENT_REGISTRY_PROD=${P2P_DEPLOYMENT_REGISTRY}/${P2P_REGISTRY_PROD_PATH}
          if [[ "${{ env.TENANT_NAME }}" == "${{ inputs.app-name }}" ]]; then
            P2P_NAMESPACE="${{ env.TENANT_NAME }}"
          else
            P2P_NAMESPACE="${{ env.TENANT_NAME }}-${{ inputs.app-name }}"
          fi
          export P2P_NAMESPACE_FUNCTIONAL=${P2P_NAMESPACE}-functional
          export P2P_NAMESPACE_NFT=${P2P_NAMESPACE}-nft
          export P2P_NAMESPACE_INTEGRATION=${P2P_NAMESPACE}-integration
          export P2P_NAMESPACE_EXTENDED=${P2P_NAMESPACE}-extended
          export P2P_NAMESPACE_PROD=${P2P_NAMESPACE}-prod
          env | grep "^P2P_" | sort | tee "${GITHUB_ENV}"

      - name: Run make ${{ inputs.command }}
        id: run-command
        if: ${{ inputs.dry-run == false }}
        working-directory: ${{ inputs.working-directory }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.auth.outputs.credentials_file_path }}
        run: |
          make ${{ inputs.command }}

      - name: Verify Zot public image read
        if: ${{ inputs.dry-run == false && env.REGISTRY_MODE == 'zot' && inputs.command == 'p2p-build' && steps.run-command.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          reference="${P2P_REGISTRY_FAST_FEEDBACK}/${P2P_APP_NAME}:${P2P_VERSION}"
          digest="$(skopeo inspect --authfile "$RUNNER_TEMP/p2p-execute-zot-auth.json" \
            "docker://${P2P_REGISTRY_FAST_FEEDBACK}/${P2P_APP_NAME}:${P2P_VERSION}" \
            | jq -er '.Digest | select(test("^sha256:[0-9a-f]{64}$"))')"
          printf '%s\n' "$digest" > "$RUNNER_TEMP/zot-public-digest"
          {
            printf '## Zot public image read\n\n'
            printf -- '- Reference: `%s`\n' "$reference"
            printf -- '- Digest: `%s`\n' "$digest"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up Docker Buildx
        if: ${{ always() }}
        shell: bash
        env:
          BUILDER_NAME: ${{ steps.setup-docker-buildx.outputs.name }}
        run: |
          set -euo pipefail
          if [[ -n "$BUILDER_NAME" ]]; then
            docker buildx rm "$BUILDER_NAME"
          fi

      - name: Resolve artifact paths
        id: resolve-artifacts
        if: ${{ always() && inputs.artifacts != '' }}
        run: |
          # Write the artifacts YAML config from the input string.
          cat <<'EOF' > artifacts.yaml
          ${{ inputs.artifacts }}
          EOF

          # Extract raw paths for the current command from the YAML config.
          raw_paths=$(yq -r '."${{ inputs.command }}" // [] | .[]' artifacts.yaml || true)

          # Make artifact paths relative to the configured working-directory (if not ".").
          wd="${{ inputs.working-directory }}"
          prefixed_paths=""
          while IFS= read -r p; do
            [ -z "${p}" ] && continue
            if [ -n "${wd}" ] && [ "${wd}" != "." ]; then
              case "${p}" in
                /*) prefixed="${p}" ;;
                *)  prefixed="${wd}/${p}" ;;
              esac
            else
              prefixed="${p}"
            fi

            if [ -z "${prefixed_paths}" ]; then
              prefixed_paths="${prefixed}"
            else
              prefixed_paths="${prefixed_paths}"$'\n'"${prefixed}"
            fi
          done <<< "${raw_paths}"

          if [ -n "${prefixed_paths}" ]; then
            {
              echo "paths<<EOF"
              echo "${prefixed_paths}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload artifacts
        if: ${{ always() && steps.resolve-artifacts.outputs.paths != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.command }}-${{ inputs.github_env || 'noenv' }}-run${{ github.run_number }}-attempt${{ github.run_attempt }}
          path: ${{ steps.resolve-artifacts.outputs.paths }}
          retention-days: 14
          if-no-files-found: warn

      - name: Clean up Zot registry credentials
        if: ${{ always() && env.REGISTRY_MODE == 'zot' }}
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/p2p-execute-docker-config"
          rm -f "$RUNNER_TEMP/p2p-execute-zot-auth.json"
