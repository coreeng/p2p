name: p2p-command

on:
  workflow_call:
    secrets:
      env_vars:
        required: false
    inputs:
      promotion-stage:
        required: true
        type: string
      dry-run:
        required: false
        type: boolean
        default: false
      source_matrix:
        required: true
        type: string
      dest_github_env:
        required: true
        type: string
      app-name:
        required: false
        type: string
        default: ''
      tenant-name:
        required: false
        type: string
        default: ''
      version:
        required: false
        type: string
        default: ''
      region:
        required: false
        type: string
        default: ''
      working-directory:
        required: false
        type: string
        default: '.'
      checkout-version:
        required: false
        type: string
      runner-label:
        description: 'GitHub Actions runner label for image promotion jobs.'
        required: false
        type: string
        default: ''

jobs:
  lookup:
    if: ${{ vars.CORECTL_CONTEXT == '' }}
    runs-on: ${{ inputs.runner-label || vars.P2P_RUNNER_LABEL || 'ubuntu-24.04' }}
    environment: ${{ fromJson(inputs.source_matrix).include[0]['deploy_env'] }}
    env:
      TENANT_NAME: ${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}
      REGISTRY: ${{ inputs.region || vars.REGION || 'europe-west2' }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/tenant/${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      SERVICE_ACCOUNT: p2p-${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}@${{ vars.PROJECT_ID }}.iam.gserviceaccount.com
      WORKLOAD_IDENTITY_PROVIDER: projects/${{ vars.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/p2p-${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}/providers/p2p-${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}
    outputs:
      source_registry: ${{ env.REGISTRY }}
      source_project_id: ${{ env.PROJECT_ID }}
      source_service_account: ${{ env.SERVICE_ACCOUNT }}
      source_workflow_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
    steps:
      - name: print env context
        run: |
          yq 'del(.env_vars)' -p=json -C <<EOT
          ${{ toJSON(env) }}
          EOT

  registry-source:
    if: ${{ vars.CORECTL_CONTEXT != '' && inputs.dry-run == false }}
    uses: ./.github/workflows/p2p-promote-source.yaml
    permissions:
      contents: read
      id-token: write
    with:
      github_env: ${{ fromJson(inputs.source_matrix).include[0]['deploy_env'] }}
      app-name: ${{ inputs.app-name }}
      tenant-name: ${{ inputs.tenant-name }}
      version: ${{ inputs.version }}
      source-stage: ${{ inputs.promotion-stage == 'prod' && 'extended-test' || 'fast-feedback' }}
      checkout-version: ${{ inputs.checkout-version }}
      working-directory: ${{ inputs.working-directory }}
      runner-label: ${{ inputs.runner-label }}

  promote-image-registry:
    if: ${{ vars.CORECTL_CONTEXT != '' && inputs.dry-run == false }}
    needs: [registry-source]
    name: promote-to-${{ inputs.promotion-stage }}
    runs-on: ${{ inputs.runner-label || vars.P2P_RUNNER_LABEL || 'ubuntu-24.04' }}
    environment: ${{ inputs.dest_github_env }}
    permissions:
      contents: read
      id-token: write
    env:
      DPLATFORM: ${{ vars.DPLATFORM || inputs.dest_github_env }}
      CORECTL_CONTEXT: ${{ vars.CORECTL_CONTEXT }}
      CORECTL_PORTAL_URL: ${{ vars.CORECTL_PORTAL_URL }}
      TENANT_NAME: ${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}
      VERSION: ${{ inputs.version }}
      PROMOTION_STAGE: ${{ inputs.promotion-stage }}
    steps:
      - name: Setup corectl
        uses: $/.github/actions/setup-corectl
        with:
          version: ${{ vars.CORECTL_VERSION || 'latest' }}
      - name: Connect to image registry
        shell: bash
        env:
          EXPECTED_GITHUB_ENV: ${{ inputs.dest_github_env }}
        run: |
          set -euo pipefail
          export XDG_CONFIG_HOME="$RUNNER_TEMP/corectl-ci"
          echo "XDG_CONFIG_HOME=$XDG_CONFIG_HOME" >> "$GITHUB_ENV"
          corectl p2p registry connect "$DPLATFORM" --application "$TENANT_NAME" \
            --context "$CORECTL_CONTEXT" --url "$CORECTL_PORTAL_URL" \
            --ci-environment "$EXPECTED_GITHUB_ENV" --output env >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: registry-promotion-images
          path: ${{ runner.temp }}/p2p-source-images
      - name: Prepare image transfer
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo
      - name: Publish promoted images
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PROMOTION_STAGE" =~ ^(extended-test|prod)$ ]] || exit 1
          [[ -s "$RUNNER_TEMP/p2p-source-images/digests.txt" ]] || exit 1
          export DOCKER_CONFIG="$RUNNER_TEMP/p2p-dest-docker"
          install -d -m 0700 "$DOCKER_CONFIG"
          while read -r image source_digest; do
            [[ "$image" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || exit 1
            [[ "$source_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || exit 1
            corectl p2p registry login "$DPLATFORM" --context "$CORECTL_CONTEXT"
            destination="docker://${P2P_REGISTRY}/${PROMOTION_STAGE}/${image}:${VERSION}"
            skopeo copy --all --preserve-digests --dest-tls-verify=false --dest-authfile "$DOCKER_CONFIG/p2p-auth.json" \
              "oci-archive:$RUNNER_TEMP/p2p-source-images/${image}.tar" "$destination"
            digest="$(skopeo inspect --tls-verify=false --authfile "$DOCKER_CONFIG/p2p-auth.json" --format '{{.Digest}}' "$destination")"
            [[ "$digest" == "$source_digest" ]] || { echo "Promotion changed image digest" >&2; exit 1; }
            echo "Promoted ${P2P_REGISTRY}/${PROMOTION_STAGE}/${image}:${VERSION} (${digest})" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/p2p-source-images/digests.txt"

      - name: Disconnect from image registry
        if: ${{ always() }}
        shell: bash
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/p2p-dest-docker"
          if command -v corectl >/dev/null && ! corectl p2p registry disconnect "$DPLATFORM" --context "$CORECTL_CONTEXT"; then
            echo "::warning title=Registry cleanup failed::The image registry connection may still be active"
          fi
          rm -rf "$DOCKER_CONFIG"

  promote-image:
    if: ${{ vars.CORECTL_CONTEXT == '' }}
    name: promote-to-${{ inputs.promotion-stage }}
    runs-on: ${{ inputs.runner-label || vars.P2P_RUNNER_LABEL || 'ubuntu-24.04' }}
    needs: [lookup]
    environment: ${{ inputs.dest_github_env }}
    env:
      env_vars: ${{ secrets.env_vars }}
      BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
      INTERNAL_SERVICES_DOMAIN: ${{ vars.INTERNAL_SERVICES_DOMAIN }}
      DEST_GITHUB_ENV: ${{ inputs.dest_github_env }}
      DPLATFORM: ${{ vars.DPLATFORM }}
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      REGION: ${{ inputs.region || vars.REGION || 'europe-west2' }}
      REGISTRY: ${{ inputs.region || vars.REGION || 'europe-west2' }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/tenant/${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}
      SERVICE_ACCOUNT: p2p-${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}@${{ vars.PROJECT_ID }}.iam.gserviceaccount.com
      VERSION: ${{ inputs.version }}
      SOURCE_GITHUB_ENV: ${{ fromJson(inputs.source_matrix).include[0]['deploy_env'] }}
      SOURCE_PROJECT_ID: ${{ needs.lookup.outputs.source_project_id }}
      SOURCE_REGISTRY: ${{ needs.lookup.outputs.source_registry }}
      SOURCE_SERVICE_ACCOUNT: ${{ needs.lookup.outputs.source_service_account }}
      SOURCE_WORKLOAD_IDENTITY_PROVIDER: ${{ needs.lookup.outputs.source_workflow_identity_provider }}
      TENANT_NAME: ${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}
      WORKLOAD_IDENTITY_PROVIDER: projects/${{ vars.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/p2p-${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}/providers/p2p-${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: print env context
        run: |
          yq 'del(.env_vars)' -p=json -C <<EOT
          ${{ toJSON(env) }}
          EOT

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.dry-run == false && inputs.checkout-version || '' }}


      - name: Authenticate to Google Cloud (Source)
        id: auth-source
        if: ${{ inputs.dry-run == false && vars.CORECTL_CONTEXT == '' }}
        uses: google-github-actions/auth@v3
        with:
          export_environment_variables: false
          workload_identity_provider: ${{ env.SOURCE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SOURCE_SERVICE_ACCOUNT }}
          project_id: ${{ env.SOURCE_PROJECT_ID }}
          token_format: access_token
          access_token_lifetime: 3600s


      - name: Authenticate to Google Cloud (Dest)
        id: auth-dest
        if: ${{ inputs.dry-run == false && vars.CORECTL_CONTEXT == '' }}
        uses: google-github-actions/auth@v3
        with:
          export_environment_variables: false
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Decode environment variables
        shell: bash
        run: |
          IFS=$'\n'
          for i in $env_vars; do
            i="${i%%=*}"="${i#*=}"
            echo "::add-mask::${i#*=}"
            printf '%s\n' "${i//\\/\\\\}" >> "${GITHUB_ENV}"
          done

      - name: Set p2p variables
        id: setup-p2p-variables
        run: |
          env | grep "^P2P_" | sort
          export P2P_TENANT_NAME="${{ env.TENANT_NAME }}"
          export P2P_APP_NAME=${{ inputs.app-name }}
          export P2P_VERSION=${{ inputs.version }}
          export P2P_REGISTRY=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/tenant/${{ env.TENANT_NAME }}
          export P2P_REGISTRY_FAST_FEEDBACK_PATH=fast-feedback
          export P2P_REGISTRY_EXTENDED_TEST_PATH=extended-test
          export P2P_REGISTRY_PROD_PATH=prod
          export P2P_REGISTRY_FAST_FEEDBACK=${P2P_REGISTRY}/${P2P_REGISTRY_FAST_FEEDBACK_PATH}
          export P2P_REGISTRY_EXTENDED_TEST=${P2P_REGISTRY}/${P2P_REGISTRY_EXTENDED_TEST_PATH}
          export P2P_REGISTRY_PROD=${P2P_REGISTRY}/${P2P_REGISTRY_PROD_PATH}
          if [[ "${{ env.TENANT_NAME }}" == "${{ inputs.app-name }}" ]]; then
            P2P_NAMESPACE="${{ env.TENANT_NAME }}"
          else
            P2P_NAMESPACE="${{ env.TENANT_NAME }}-${{ inputs.app-name }}"
          fi
          export P2P_NAMESPACE_FUNCTIONAL=${P2P_NAMESPACE}-functional
          export P2P_NAMESPACE_NFT=${P2P_NAMESPACE}-nft
          export P2P_NAMESPACE_INTEGRATION=${P2P_NAMESPACE}-integration
          export P2P_NAMESPACE_EXTENDED=${P2P_NAMESPACE}-extended
          export P2P_NAMESPACE_PROD=${P2P_NAMESPACE}-prod
          env | grep "^P2P_" | sort | tee "${GITHUB_ENV}"

      - name: Setup skopeo
        id: setup-skopeo
        if: ${{ inputs.dry-run == false && vars.CORECTL_CONTEXT == '' }}
        env:
          SOURCE_ACCESS_TOKEN: ${{ steps.auth-source.outputs.access_token }}
          DEST_ACCESS_TOKEN: ${{ steps.auth-dest.outputs.access_token }}
        run: |
          skopeo login -u oauth2accesstoken --password-stdin "${SOURCE_REGISTRY}" < <(echo "${SOURCE_ACCESS_TOKEN}")
          skopeo login -u oauth2accesstoken --password-stdin "${REGISTRY}" < <(echo "${DEST_ACCESS_TOKEN}")

      - name: Promote to ${{ inputs.promotion-stage }}
        id: run-promotion
        if: ${{ inputs.dry-run == false }}
        working-directory: ${{ inputs.working-directory }}
        env:
          SOURCE_AUTH_OVERRIDE: ${{ steps.auth-source.outputs.credentials_file_path }}
          SOURCE_ACCESS_TOKEN: ${{ steps.auth-source.outputs.access_token }}
          DEST_AUTH_OVERRIDE: ${{ steps.auth-dest.outputs.credentials_file_path }}
          DEST_ACCESS_TOKEN: ${{ steps.auth-dest.outputs.access_token }}
        run: |
          make p2p-promote-to-${{ inputs.promotion-stage }}
