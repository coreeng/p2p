on:
  workflow_call:
    secrets:
      env_vars:
        required: false
      slack_webhook_url:
        required: false
    outputs:
      version:
        description: "The latest image in the registry"
        value: ${{ jobs.get-latest-version.outputs.version }}
    inputs:
      environment:
        required: false
        type: string
        default: ${{ vars.EXTENDED_TEST }}
      dry-run:
        required: false
        type: boolean
        default: false
      main-branch:
        required: false
        type: string
        default: 'refs/heads/main'
      working-directory:
        required: false
        type: string
        default: '.'
      registry-path:
        required: false
        type: string
        default: 'extended-test'
      tenant-name:
        required: false
        type: string
        default: ''
      app-name:
        description: 'Application name; defaults to image-name.'
        required: false
        type: string
        default: ''
      image-name:
        required: true
        type: string
      region:
        required: false
        type: string
        default: ''
      runner-label:
        description: 'GitHub Actions runner label for latest-image jobs.'
        required: false
        type: string
        default: ''

jobs:
  resolve-targets:
    if: ${{ vars.CORECTL_CONTEXT != '' && github.ref == inputs.main-branch }}
    uses: ./.github/workflows/p2p-resolve-targets.yaml
    with:
      app-name: ${{ inputs.app-name || inputs.image-name }}
      source-stage: extendedTest
      runner-label: ${{ inputs.runner-label }}

  get-latest-version:
    needs: [resolve-targets]
    uses: ./.github/workflows/p2p-get-latest-image.yaml
    if: ${{ !cancelled() && github.ref == inputs.main-branch && (vars.CORECTL_CONTEXT == '' || needs.resolve-targets.result == 'success') }}
    secrets:
      env_vars: ${{ secrets.env_vars }}
    strategy:
      matrix: ${{ fromJSON(vars.CORECTL_CONTEXT != '' && needs.resolve-targets.outputs.source || inputs.environment) }}
      fail-fast: false
    with:
      github_env: ${{ matrix.deploy_env }}
      registry-path: ${{ inputs.registry-path }}
      tenant-name: ${{ inputs.tenant-name }}
      image-name: ${{ inputs.image-name }}
      dry-run: ${{ inputs.dry-run }}
      working-directory: ${{ inputs.working-directory }}
      region: ${{ inputs.region }}
      runner-label: ${{ inputs.runner-label }}

  notify-failure:
    needs: [resolve-targets, get-latest-version]
    runs-on: ${{ inputs.runner-label || vars.P2P_RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 5
    if: always() && github.ref == inputs.main-branch && contains(needs.*.result, 'failure')

    env:
      SLACK_WEBHOOK_URL: ${{ secrets.slack_webhook_url }}

    steps:
      - id: slack-alert
        name: Slack alert
        uses: slackapi/slack-github-action@v4
        if: env.SLACK_WEBHOOK_URL != ''
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: webhook-trigger
          payload: |
            notification: "P2P get-latest-image (extended-test) failed"
            workflow_link: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
