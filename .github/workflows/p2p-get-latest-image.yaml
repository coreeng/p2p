name: p2p-command

on:
  workflow_call:
    secrets:
      env_vars:
        required: false
    outputs:
      version:
        description: "The latest image in the registry"
        value: ${{ jobs.get-latest-image.outputs.version }}
      found:
        description: "Whether a latest image tag was found"
        value: ${{ jobs.get-latest-image.outputs.found }}
    inputs:
      registry-path:
        required: false
        type: string
        default: 'extended-test'
      tenant-name:
        required: false
        type: string
        default: ''
      image-name:
        required: true
        type: string
      dry-run:
        required: false
        type: boolean
        default: false
      region:
        required: false
        type: string
        default: ''
      github_env:
        required: true
        type: string
      working-directory:
        required: false
        type: string
        default: '.'
      runner-label:
        description: 'GitHub Actions runner label for image lookup.'
        required: false
        type: string
        default: ''

jobs:
  get-latest-image:
    name: get-latest-image (${{ inputs.registry-path }}, ${{ inputs.github_env }})
    runs-on: ${{ inputs.runner-label || vars.P2P_RUNNER_LABEL || 'ubuntu-24.04' }}
    outputs:
      version: ${{ steps.get-latest-image.outputs.version }}
      found: ${{ steps.get-latest-image.outputs.found }}
    environment: ${{ inputs.github_env }}
    env:
      BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
      INTERNAL_SERVICES_DOMAIN: ${{ vars.INTERNAL_SERVICES_DOMAIN }}
      DPLATFORM: ${{ vars.DPLATFORM || inputs.github_env }}
      CORECTL_CONTEXT: ${{ vars.CORECTL_CONTEXT }}
      CORECTL_PORTAL_URL: ${{ vars.CORECTL_PORTAL_URL }}
      PROJECT_ID: ${{ vars.PROJECT_ID }}
      PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
      REGION: ${{ inputs.region || vars.REGION || 'europe-west2' }}
      REGISTRY: ${{ inputs.region || vars.REGION || 'europe-west2' }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/tenant/${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}
      SERVICE_ACCOUNT: p2p-${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}@${{ vars.PROJECT_ID }}.iam.gserviceaccount.com
      ENV_NAME: ${{ inputs.github_env }}
      TENANT_NAME: ${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}
      WORKLOAD_IDENTITY_PROVIDER: projects/${{ vars.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/p2p-${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}/providers/p2p-${{ inputs.tenant-name != '' && inputs.tenant-name || vars.TENANT_NAME }}
      REGISTRY_PATH: ${{ inputs.registry-path }}
      IMAGE_NAME: ${{ inputs.image-name }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: print env context
        run: |
          yq 'del(.env_vars)' -p=json -C <<EOT
          ${{ toJSON(env) }}
          EOT

      - name: Authenticate to Google Cloud
        id: auth
        if: ${{ inputs.dry-run == false && vars.CORECTL_CONTEXT == '' }}
        uses: google-github-actions/auth@v3
        with:
          export_environment_variables: true
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          project_id: ${{ env.PROJECT_ID }}
          token_format: access_token
          access_token_lifetime: 3600s

      - name: Checkout P2P workflow sources
        uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .p2p-workflow-src

      - name: Move P2P workflow sources outside app workspace
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/p2p-workflow-src"
          mv .p2p-workflow-src "$RUNNER_TEMP/p2p-workflow-src"

      - name: Setup corectl
        if: ${{ inputs.dry-run == false && vars.CORECTL_CONTEXT != '' }}
        uses: $/.github/actions/setup-corectl
        with:
          version: ${{ vars.CORECTL_VERSION || 'latest' }}

      - name: Prepare image lookup
        if: ${{ inputs.dry-run == false && vars.CORECTL_CONTEXT != '' }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes skopeo

      - name: Connect to image registry
        if: ${{ inputs.dry-run == false && vars.CORECTL_CONTEXT != '' }}
        shell: bash
        env:
          EXPECTED_GITHUB_ENV: ${{ inputs.github_env }}
        run: |
          "$RUNNER_TEMP/p2p-workflow-src/.github/scripts/registry-connect" "$EXPECTED_GITHUB_ENV"

      - name: Authenticate to image registry
        if: ${{ inputs.dry-run == false && vars.CORECTL_CONTEXT != '' }}
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$RUNNER_TEMP/p2p-latest-docker"
          install -d -m 0700 "$DOCKER_CONFIG"
          "$RUNNER_TEMP/p2p-workflow-src/.github/scripts/registry-login" \
            --audience "core-platform-registry:$DPLATFORM" --registry "${P2P_REGISTRY%%/*}" \
            --skopeo-auth-file "$RUNNER_TEMP/p2p-registry-auth.json"

      - name: Get latest image
        id: get-latest-image
        env:
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
            set -euo pipefail
            if [ "$DRY_RUN" == false ]; then
              if [[ -n "$CORECTL_CONTEXT" ]]; then
                [[ "$REGISTRY_PATH" =~ ^(fast-feedback|extended-test|prod)$ ]] || exit 1
                [[ "$IMAGE_NAME" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || exit 1
                version="$(skopeo list-tags --tls-verify=false --authfile "$RUNNER_TEMP/p2p-registry-auth.json" \
                  "docker://${P2P_REGISTRY}/${REGISTRY_PATH}/${IMAGE_NAME}" | jq -r '.Tags[]?' \
                  | node "$RUNNER_TEMP/p2p-workflow-src/.github/scripts/latest-image.js")"
              else
                if ! version=$(gcloud artifacts docker images list "${REGISTRY}/${REGISTRY_PATH}/${IMAGE_NAME}" --include-tags --sort-by=~buildTime --format=json 2>/dev/null | node "$RUNNER_TEMP/p2p-workflow-src/.github/scripts/latest-image.js"); then
                  echo "exiting"
                  exit 1
                fi
              fi
            else
              version="0.0.0"
            fi
            found=true
            if [ "$DRY_RUN" == false ] && { [ -z "${version:-}" ] || [ "${version}" == "null" ]; }; then
              echo "No image tags found for ${REGISTRY}/${REGISTRY_PATH}/${IMAGE_NAME}; skipping downstream scan."
              version=""
              found=false
            fi
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "found=${found}" >> "$GITHUB_OUTPUT"

      - name: "Output version: ${{ steps.get-latest-image.outputs.version }}"
        id: outputversion
        shell: bash
        run: |
          echo "Output version: ${{ steps.get-latest-image.outputs.version }}"
          echo "Found image: ${{ steps.get-latest-image.outputs.found }}"
