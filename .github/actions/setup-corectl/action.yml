name: Setup corectl
description: Install and verify corectl
inputs:
  version:
    description: corectl version to install
    required: false
    default: latest
runs:
  using: composite
  steps:
    - name: Setup ORAS
      uses: oras-project/setup-oras@v2
      with:
        # setup-oras@v2 has not added 1.3.4 to its version catalog yet.
        url: https://github.com/oras-project/oras/releases/download/v1.3.4/oras_1.3.4_linux_amd64.tar.gz
        checksum: f27adb935022d94df8dc77719c322dda592c78a0d57a6f7dcdd8d900b248c454
    - name: Install corectl
      shell: bash
      env:
        CORECTL_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/corectl-download"
        package=ghcr.io/coreeng/corectl
        digest="$(oras resolve "$package:$CORECTL_VERSION")"
        oras pull "$package@$digest" -o "$RUNNER_TEMP/corectl-download"
        (
          cd "$RUNNER_TEMP/corectl-download"
          release_files=(release_*.json)
          if [[ ${#release_files[@]} != 1 || ! -f "${release_files[0]}" ]]; then
            echo "Expected exactly one corectl release metadata file" >&2
            exit 1
          fi
          version="$(jq -er '.version | strings' "${release_files[0]}")"
          [[ "$version" =~ ^[a-zA-Z0-9][a-zA-Z0-9._-]*$ ]]
          [[ "${release_files[0]}" == "release_${version}.json" ]]
          if [[ "$CORECTL_VERSION" == latest ]]; then
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "corectl latest must reference a production release" >&2
              exit 1
            }
          else
            [[ "$version" == "$CORECTL_VERSION" ]]
          fi
          sha256sum -c "checksums_${version}.txt"
          tar -xzf "corectl_${version}_linux_x86_64.tar.gz"
          printf 'Using corectl %s (%s)\n' "$version" "$digest"
        )
        echo "$RUNNER_TEMP/corectl-download" >> "$GITHUB_PATH"
